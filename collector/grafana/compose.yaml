# The vmsotel collector with dashboards: OpenTelemetry Collector ->
# Prometheus (metrics) and Loki (logs) -> Grafana.
#
#   cd collector/grafana && docker compose up -d
#   Grafana: http://<this host>:3300  (admin / admin; it asks for a new one)
#   GRAFANA_PORT=nnnn docker compose up -d    to use another port
#
# The collector takes the same ports as collector/collector.yaml (4318
# plain, 4319 TLS), so stop that one first. The TLS receiver needs
# ../collector.crt and ../collector.key: run ../make-cert.sh once.
#
# restart: always, not unless-stopped, so the stack comes back after the
# host reboots under Podman too: Ubuntu 24.04's podman-restart.service
# (Podman 4.9.3) starts only restart-policy=always containers, and a
# tester's unless-stopped stack stayed down; with always it was up 8 s
# after the reboot. Docker treats the two alike at boot.
#
# Collector 0.111.0 is the version vmsotel was tested against, and the
# one docs/operations.md's debug-output script looks for.
#
# Image names are fully qualified (docker.io/...) so that Podman, which
# will not guess a registry for a short name unless configured to, pulls
# the same images Docker does; Docker treats both spellings the same.

services:
  otelcol:
    image: docker.io/otel/opentelemetry-collector:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro
      - ../collector.crt:/etc/otelcol/collector.crt:ro
      - ../collector.key:/etc/otelcol/collector.key:ro
    ports:
      - "4318:4318"
      - "4319:4319"
    depends_on: [prometheus, loki]
    restart: always

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: always

  loki:
    image: docker.io/grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: always

  grafana:
    image: docker.io/grafana/grafana:12.0.0
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Not 3000: docker-nuc already serves that (nghttpx).
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus, loki]
    restart: always

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
