apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # vmsotel exports once a minute; $__rate_interval follows this.
      timeInterval: 60s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
